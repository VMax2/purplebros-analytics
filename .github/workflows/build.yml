name: Build PurpleBros Analytics

on:
  schedule:
    # Controlla automaticamente ogni 6 ore se c'è una nuova release
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag versione Umami (es. v2.14.0). Lascia vuoto per compilare l'ultima release stabile.'
        required: false
        default: ''
      force_build:
        description: 'Forza la ricompilazione anche se il tag esiste già'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

jobs:
  check-and-build:
    name: Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repository Privato
        uses: actions/checkout@v4
        with:
          path: custom-config
          fetch-depth: 0

      - name: Identificazione Versione Umami e Controllo Aggiornamenti
        id: resolve-version
        run: |
          cd custom-config
          
          # Se specificato manualmente
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            echo "Modalità manuale: versione richiesta -> $TAG"
            SHOULD_BUILD=true
          else
            echo "Controllo ultima release stabile ufficiale da GitHub API..."
            TAG=$(curl -s https://api.github.com/repos/umami-software/umami/releases/latest | jq -r .tag_name)
            echo "Ultima release stabile upstream: $TAG"
            
            # Verifica se il tag è già stato compilato
            if git rev-parse "$TAG" >/dev/null 2>&1 && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
              echo "ℹ La versione $TAG è già stata compilata in precedenza. Nessuna azione necessaria."
              SHOULD_BUILD=false
            else
              echo "🚀 Nuova release rilevata: $TAG. Avvio build automatica..."
              SHOULD_BUILD=true
            fi
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "❌ Errore: Impossibile determinare la versione di Umami."
            exit 1
          fi

          echo "TARGET_TAG=$TAG" >> $GITHUB_ENV
          echo "SHOULD_BUILD=$SHOULD_BUILD" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/purplebros-analytics" >> $GITHUB_ENV

      - name: Clona Repository Ufficiale di Umami
        if: env.SHOULD_BUILD == 'true'
        run: |
          echo "Clonando umami-software/umami al tag ${{ env.TARGET_TAG }}..."
          git clone --branch "${{ env.TARGET_TAG }}" --depth 1 https://github.com/umami-software/umami.git umami-src

      - name: Iniezione Risorse Grafiche (Logo & Favicon)
        if: env.SHOULD_BUILD == 'true'
        run: |
          echo "Iniezione file di branding..."
          cd umami-src

          if [ -f "../custom-config/branding/logo.svg" ]; then
            cp ../custom-config/branding/logo.svg src/assets/logo.svg
            echo "✔ logo.svg iniettato in src/assets/"
          fi

          if [ -d "../custom-config/branding" ]; then
            cp -r ../custom-config/branding/* public/ 2>/dev/null || true
            if [ -f "../custom-config/branding/logo.svg" ]; then
              cp ../custom-config/branding/logo.svg src/assets/logo.svg
            fi
            echo "✔ Favicon e icone copiate in public/"
          fi

      - name: Esecuzione Script di Rebranding Testuale
        if: env.SHOULD_BUILD == 'true'
        run: |
          cd umami-src
          python3 ../custom-config/scripts/rebrand.py

      - name: Login a GitHub Container Registry (GHCR)
        if: env.SHOULD_BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Compilazione e Pubblicazione Immagine Docker (PostgreSQL)
        if: env.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./umami-src
          file: ./umami-src/Dockerfile
          build-args: |
            DATABASE_TYPE=postgresql
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.TARGET_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Registrazione Tag nel Repository
        if: env.SHOULD_BUILD == 'true'
        run: |
          cd custom-config
          if ! git rev-parse "${{ env.TARGET_TAG }}" >/dev/null 2>&1; then
            echo "Creazione tag ${{ env.TARGET_TAG }}..."
            git tag "${{ env.TARGET_TAG }}"
            git push origin "${{ env.TARGET_TAG }}"
          fi
